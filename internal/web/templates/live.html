{{template "base.html" .}}

{{define "content"}}
<div class="live-page">
    <h1>Просмотр в реальном времени</h1>
    
    {{range .Cameras}}
    <div class="live-stream">
        <h2>{{.Name}}</h2>
        <div class="stream-container">
            <img src="/api/v1/stream/mjpeg/{{.ID}}" alt="{{.Name}} live stream" style="width:100%;height:100%;object-fit:cover;">
        </div>
        <div class="stream-controls">
            <button class="btn btn-small" onclick="this.parentElement.querySelector('img').src='/api/v1/stream/mjpeg/{{.ID}}?t=' + Date.now()">Обновить</button>
            <span class="text-muted" style="margin-left:8px;">MJPEG поток</span>
        </div>
    </div>
    {{end}}
</div>

<style>
.stream-controls {
    margin-top: 8px;
    display: flex;
    align-items: center;
}
</style>
{{end}}
